server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB
traza:
  jwt-secret: ${TRAZA_JWT_SECRET:}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  bootstrap-user: ${TRAZA_BOOTSTRAP_USERNAME:}
  bootstrap-password: ${TRAZA_BOOTSTRAP_PASSWORD:}
