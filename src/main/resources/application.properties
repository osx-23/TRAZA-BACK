server.port=${PORT:8080}
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
traza.jwt-secret=${TRAZA_JWT_SECRET:}
traza.cors-origins=${APP_CORS_ORIGINS:http://localhost:4200}
traza.bootstrap-user=${TRAZA_BOOTSTRAP_USERNAME:}
traza.bootstrap-password=${TRAZA_BOOTSTRAP_PASSWORD:}
